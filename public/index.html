<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Movie List</h1>
    <form id="searchForm">
        <input type="text" id="searchInput" placeholder="Search for a movie...">
        <button type="submit">Search</button>
    </form>
    <section>
        <ul id="movieList"></ul>
    </section>



    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const movieList = document.getElementById('movieList');

        searchForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                try {
                    const response = await fetch(`/api/movies?title=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data.Response === 'False') {
                        displayMessage('Nenhum filme encontrado.');
                        return;
                    }
                    
                    displayMovies(data.Search);
                } catch (error) {
                    displayMessage('Erro ao buscar filmes.');
                }
            }
        });

        function displayMovies(movies) {
            movieList.innerHTML = '';

            movies.forEach(movie => {
                const movieCard = `
                    <li class="card">
                        <img class="movie-poster" src="${movie.Poster !== 'N/A' ? movie.Poster : '/'}" alt="${movie.Title}">
                        <span>${movie.Title} (${movie.Year})</span>
                    </li>
                `;
                movieList.innerHTML += movieCard;

            });
        }
        
        function displayMessage(message) {
            movieList.innerHTML = `<span>${message}</span>`;
        }
    </script>
    
</body>
</html>
